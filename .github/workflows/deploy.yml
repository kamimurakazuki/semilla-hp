# GitHub Pages 自動デプロイ
# main ブランチに push されるたびに、サイトをビルドして公開する。
#
# 独自ドメイン（semilla-inc.com）へ切り替える際は、
# 下の env の SITE_URL を https://semilla-inc.com に変更し、BASE_PATH を空にすること。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build site
        run: node build.js
        env:
          SITE_URL: https://kamimurakazuki.github.io/semilla-hp
          BASE_PATH: /semilla-hp
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
