# GitHub Pages 自動デプロイ
# main ブランチに push されるたびに、サイトをビルドして公開する。
#
# 正式URL（canonical・OGP・sitemap）は独自ドメイン https://semilla-inc.com に統一済み。
# BASE_PATH は GitHub Pages のサブパス配信（/semilla-hp/）のためのアセットパス調整にのみ使用。
# 本番は Railway（railway.json / server.js）で配信する。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build site
        run: node build.js
        env:
          SITE_URL: https://semilla-inc.com
          BASE_PATH: /semilla-hp
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
